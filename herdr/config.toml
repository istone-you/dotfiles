onboarding = false

[keys]
goto               = "prefix+t"
switch_tab         = "ctrl+alt+1..9"
previous_tab       = "ctrl+alt+left"
next_tab           = "ctrl+alt+right"
previous_workspace = "ctrl+alt+up"
next_workspace     = "ctrl+alt+down"
previous_agent     = "ctrl+alt+shift+up"
next_agent         = "ctrl+alt+shift+down"
focus_pane_up      = "ctrl+shift+up"
focus_pane_down    = "ctrl+shift+down"
focus_pane_left    = "ctrl+shift+left"
focus_pane_right   = "ctrl+shift+right"

[[keys.command]]
key         = "prefix+enter"
command     = "zsh"
type        = "popup"
description = "terminal"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+g"
command     = "zsh -ic 'nvim +Git!'"
type        = "popup"
description = "git panel"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+e"
command     = "zsh -ic 'nvim +Explorer!'"
type        = "popup"
description = "explorer"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+t"
command     = "zsh"
type        = "popup"
description = "terminal"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+n"
command     = 'sh -c "herdr pane move $(herdr pane current | jq -r .result.pane.pane_id) --new-tab --focus"'
type        = "shell"
description = "move pane to new tab"

[worktrees]
directory = "/app/.tmp/worktree"

[experimental]
kitty_graphics = true

[theme]
name = "catppuccin"

[theme.custom]
# パネルクロム(タブバー等)の背景を端末背景に透過させる（reset/none/transparent/default）
panel_bg = "reset"
